version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: sihp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: sihp
    ports:
      - "5435:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sihp-network

  minio:
    image: minio/minio:latest
    container_name: sihp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - sihp-network

  minio-init:
    image: minio/mc:latest
    container_name: sihp-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
        echo 'waiting for minio...';
        sleep 2;
      done;
      mc mb local/komoditas --ignore-existing;
      mc anonymous set download local/komoditas;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    networks:
      - sihp-network

  app:
    build:
      context: .
      target: dev
    container_name: sihp-be
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      MIGRATE_ENV: docker
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_URL: http://127.0.0.1:9000/komoditas
    ports:
      - "8080:8080"
    volumes:
      - ./:/app
    networks:
      - sihp-network

volumes:
  db_data:
  minio_data:

networks:
  sihp-network:
    driver: bridge
